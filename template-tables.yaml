# infrastructure/template-tables.yaml
AWSTemplateFormatVersion: "2010-09-09"

Description: >
  Crea las tablas DynamoDB users y devices con sus índices.
  Ejecutar UNA SOLA VEZ manualmente.

Resources:
  # ── Tabla users ────────────────────────────────────────────────────────
  UsersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain # nunca se borra aunque elimines el stack
    UpdateReplacePolicy: Retain
    Properties:
      TableName: "users"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: username
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: username-index
          KeySchema:
            - AttributeName: username
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # ── Tabla devices ──────────────────────────────────────────────────────
  DevicesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: "devices"
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: device_id
          AttributeType: S

      KeySchema:
        - AttributeName: device_id
          KeyType: HASH

  UserDevicesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: "user_devices"
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: device_id
          AttributeType: S

      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: device_id
          KeyType: RANGE

      GlobalSecondaryIndexes:
        - IndexName: device_id-index
          KeySchema:
            - AttributeName: device_id
              KeyType: HASH
            - AttributeName: user_id
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

Outputs:
  UsersTableName:
    Value: !Ref UsersTable
  DevicesTableName:
    Value: !Ref DevicesTable
  UserDevicesTableName:
    Value: !Ref UserDevicesTable
